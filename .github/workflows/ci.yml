name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo necesita leer el codigo.
permissions:
  contents: read

# Un push nuevo cancela la ejecucion anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # El arranque falla a proposito si faltan estas variables. Para comprobar
      # tipos, lint y build no hace falta un proyecto real: nada de esto sale a
      # la red, y los tests de RLS corren sobre Postgres embebido.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` genera PageProps y LayoutProps, que son tipos globales
      # producidos por Next. Sin ellos, tsc falla en un arbol recien clonado.
      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Row Level Security
        run: npm run test:db
