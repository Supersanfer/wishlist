name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # El arranque falla a proposito si faltan estas variables. Para comprobar
      # tipos, lint y build no hace falta un proyecto real: nada de esto sale a
      # la red, y los tests de RLS corren sobre Postgres embebido.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Row Level Security
        run: npm run test:db
